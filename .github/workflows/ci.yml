name: NumeriLab CI - Intégration Continue

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Validation & Build du projet
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code (Checkout)
        uses: actions/checkout@v4

      - name: 2. Configuration de l'environnement Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: 3. Installation des dépendances Backend
        run: npm ci --prefix backend || npm install --prefix backend

      - name: 4. Vérification de la syntaxe et chargement Backend
        run: node -e "import('./backend/src/app.js').then(() => console.log('Backend OK'))"

      - name: 5. Installation des dépendances Frontend
        run: npm ci --prefix frontend || npm install --prefix frontend

      - name: 6. Compilation du Frontend (Vite Build)
        run: npm run --prefix frontend build

      - name: 7. Vérification des livrables de production
        run: |
          test -f frontend/dist/index.html && echo "Livrable frontend/dist/index.html valide !"
